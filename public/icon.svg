<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Outer Stator Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#1e293b" stroke-width="24" />
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#skyGrad)" stroke-width="6" stroke-dasharray="16 12" />

  <!-- Motor Stator Poles / Copper Windings -->
  <g stroke="url(#amberGrad)" stroke-width="14" stroke-linecap="round">
    <line x1="256" y1="64" x2="256" y2="114" />
    <line x1="256" y1="398" x2="256" y2="448" />
    <line x1="64" y1="256" x2="114" y2="256" />
    <line x1="398" y1="256" x2="448" y2="256" />
    <line x1="120" y1="120" x2="156" y2="156" />
    <line x1="356" y1="356" x2="392" y2="392" />
    <line x1="356" y1="120" x2="392" y2="156" />
    <line x1="120" y1="356" x2="156" y2="392" />
  </g>

  <!-- Rotor Core -->
  <circle cx="256" cy="256" r="92" fill="#0f172a" stroke="url(#skyGrad)" stroke-width="8" filter="url(#glow)" />
  <circle cx="256" cy="256" r="48" fill="#1e293b" stroke="#334155" stroke-width="6" />

  <!-- Lightning Bolt Energy Core -->
  <path d="M268 184 L220 264 L252 264 L244 328 L292 248 L260 248 Z" fill="url(#amberGrad)" filter="url(#glow)" />
</svg>
